name: Hyperion-Zero CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build, Test & Verify Zero-Warnings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check compilation (no warnings allowed)
        run: RUSTFLAGS="-D warnings" cargo check --all-targets

      - name: Run Enclave Integration Suite
        run: cargo test --test enclave_integration

      - name: Run full test suite
        run: cargo test
